      title: Kindergarten through Grade 5 domains
      children:
        - {code: CC, title: Counting and Cardinality}
        - {code: OA, title: Operations and Algebraic Thinking}
        - {code: NBT, title: Number and Operations in Base Ten}
        - {code: NF, title: Number and Operations—Fractions}
        - {code: MD, title: Measurement and Data}
        - {code: G, title: Geometry}
    - code: 6-8
      item_type: grade_band
      title: Grades 6 through 8 domains
      children:
        - {code: RP, title: Ratios and Proportional Relationships}
        - {code: NS, title: The Number System}
        - {code: EE, title: Expressions and Equations}
        - {code: F, title: Functions}
        - {code: G, title: Geometry}
        - {code: SP, title: Statistics and Probability}
