    - code: MP
      item_type: Standards for Mathematical Practice
      title: Standards for Mathematical Practice
      children:
        - {code: MP1, title: Make sense of problems and persevere in solving them}
        - {code: MP2, title: Reason abstractly and quantitatively}
        - {code: MP3, title: Construct viable arguments and critique the reasoning of others}
        - {code: MP4, title: Model with mathematics}
        - {code: MP5, title: Use appropriate tools strategically}
        - {code: MP6, title: Attend to precision}
        - {code: MP7, title: Look for and make use of structure}
        - {code: MP8, title: Look for and express regularity in repeated reasoning}
