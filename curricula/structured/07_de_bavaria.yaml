curriculum:
  official_name: LehrplanPLUS Grundschule
  subject: Mathematik
  education_stage: Grundschule
  grade_or_level: [Jahrgangsstufen 1/2, Jahrgangsstufen 3/4]
  version: Mai 2014
  effective_from: "2014-08-01"
  language: de
  extraction_scope: MathematikのLernbereicheとTeilbereicheを、1/2および3/4学年帯に沿って構造化した概要です。
  items:
    - code: M1
      item_type: Lernbereich
      title: Zahlen und Operationen
      children:
        - {code: M1.1, title: Zahlen strukturiert darstellen und Zahlbeziehungen formulieren}
        - {code: M1.2, title: Im Zahlenraum rechnen und Strukturen nutzen}
        - {code: M1.3, title: Sachsituationen und Mathematik in Beziehung setzen}
    - code: M2
      item_type: Lernbereich
      title: Raum und Form
      children:
        - {code: M2.1, title: Sich im Raum orientieren}
        - {code: M2.2, title: Geometrische Figuren benennen und darstellen}
        - {code: M2.3, title: Geometrische Abbildungen erkennen, beschreiben und darstellen}
        - {code: M2.4, title: Geometrische Muster untersuchen und erstellen}
        - {code: M2.5, title: Flächeninhalte, Umfänge und Rauminhalte bestimmen und vergleichen}
    - code: M3
      item_type: Lernbereich
      title: Größen und Messen
      children:
        - {code: M3.1, title: Messhandlungen durchführen}
        - {code: M3.2, title: Größen strukturieren und Größenvorstellungen nutzen}
        - {code: M3.3, title: Mit Größen in Sachsituationen umgehen}
    - code: M4
      item_type: Lernbereich
      title: Daten und Zufall
      children:
        - {code: M4.1, title: Daten erfassen und strukturiert darstellen}
        - {code: M4.2, title: Zufallsexperimente durchführen und Wahrscheinlichkeiten vergleichen}
