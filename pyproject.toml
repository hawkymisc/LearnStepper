[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "learnstepper"
version = "0.1.0"
description = "Framework-independent local Application Core for LearnStepper"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.6,<8",
  "mypy>=1.15,<2",
  "pyinstaller>=6.16,<7",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["learnstepper"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["learnstepper"]

[tool.coverage.report]
show_missing = true
skip_covered = true
