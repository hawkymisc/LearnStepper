name: Validate, package, and publish downloads

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run --extra dev ruff check learnstepper tests
      - run: uv run --extra dev mypy learnstepper

  package:
    name: Package macOS arm64
    needs: validate
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: npm ci
      - run: npm install --global @openai/codex@0.144.5
      - run: npm run desktop:package
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: release/*
          if-no-files-found: error

  deploy-pages:
    name: Deploy download page
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: pages/downloads
          merge-multiple: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
