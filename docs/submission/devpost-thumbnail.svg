<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">LearnStepper Devpost thumbnail</title>
  <desc id="desc">LearnStepper, local-first AI learning, built with Codex and GPT-5.6.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061a39"/>
      <stop offset="0.62" stop-color="#0b2d58"/>
      <stop offset="1" stop-color="#124d82"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42a5ff"/>
      <stop offset="1" stop-color="#20d4cf"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2aa8ff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#2aa8ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="iconClip">
      <rect x="760" y="176" width="352" height="352" rx="80"/>
    </clipPath>
    <filter id="iconShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#001229" flood-opacity="0.42"/>
    </filter>
    <style>
      .eyebrow { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2.4px; fill: #9ed3ff; }
      .title { font: 700 76px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -2px; fill: #ffffff; }
      .tagline { font: 500 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #dceeff; }
      .badge { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .footnote { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #acd4f4; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="url(#background)"/>
  <circle cx="918" cy="342" r="430" fill="url(#glow)"/>
  <path d="M0 715 C250 630, 430 800, 720 690 C930 610, 1040 640, 1200 570 V800 H0 Z" fill="#03142e" opacity="0.58"/>
  <rect x="0" y="0" width="14" height="800" fill="url(#accent)"/>

  <text x="88" y="126" class="eyebrow">OPENAI BUILD WEEK 2026 · EDUCATION</text>
  <text x="88" y="254" class="title">LearnStepper</text>
  <rect x="88" y="288" width="112" height="8" rx="4" fill="url(#accent)"/>
  <text x="88" y="372" class="tagline">Local-first AI learning.</text>
  <text x="88" y="421" class="tagline">One verified step at a time.</text>

  <g transform="translate(88 492)">
    <rect width="196" height="54" rx="27" fill="#ffffff" fill-opacity="0.12" stroke="#79bfff" stroke-opacity="0.65"/>
    <text x="98" y="35" text-anchor="middle" class="badge">Codex + GPT-5.6</text>
  </g>
  <g transform="translate(302 492)">
    <rect width="136" height="54" rx="27" fill="#ffffff" fill-opacity="0.12" stroke="#79bfff" stroke-opacity="0.65"/>
    <text x="68" y="35" text-anchor="middle" class="badge">Local-first</text>
  </g>

  <g filter="url(#iconShadow)">
    <rect x="746" y="162" width="380" height="380" rx="94" fill="#ffffff" fill-opacity="0.10" stroke="#8ccaff" stroke-opacity="0.56" stroke-width="2"/>
    <image href="../../assets/learnstepper-icon-source.png" x="760" y="176" width="352" height="352" preserveAspectRatio="xMidYMid slice" clip-path="url(#iconClip)"/>
  </g>

  <g opacity="0.42">
    <path d="M828 635 h108 v-34 h108 v-34 h108" fill="none" stroke="#67c8ff" stroke-width="14" stroke-linejoin="round"/>
    <path d="M1152 567 l-17 -17 m17 17 l-17 17" stroke="#67c8ff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <text x="88" y="710" class="footnote">Persistent objectives · evidence-backed progress · learning history that survives restart</text>
</svg>
